apiVersion: ax.io/v1alpha1
kind: Workspace
metadata:
    name: agent-lab
    atespace: default
spec:
    git:
        - name: agent-lab
          repo: http://100.65.215.34:18080/agent-lab.git
          branch: main
          depth: 1
---
apiVersion: ax.io/v1alpha1
kind: Task
metadata:
    name: lab-toplines1
    atespace: default
spec:
    image: localhost:5001/ax-task-runner@sha256:594e20cb3e23a5961cf6c7c9cb40e06e670e43a2172534d17eccbf65f8b1ff94
    workspaces:
        - name: agent-lab
          path: /workspace
    command:
        - python3
        - -c
        - |
          import subprocess, json, urllib.request, datetime, os, shlex, sys, tarfile, re, difflib

          NODE_VER = "v22.23.3"
          TGZ = f"node-{NODE_VER}-linux-arm64.tar.gz"
          NODE = f"/tmp/node-{NODE_VER}-linux-arm64/bin"
          RECEIVER = "http://100.65.215.34:18080/lab-toplines1"

          status, answer, raw_tail, patch, tests_out = "unknown", "", "", "", ""
          _LAST = {"stderr": "", "cmd": ""}

          def sh(cmd, timeout=1500):
              print("$", cmd.split()[0], "...", flush=True)
              try:
                  p = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=timeout)
              except subprocess.TimeoutExpired:
                  print("TIMEOUT", cmd[:60], flush=True)
                  return None
              print("rc=", p.returncode, flush=True)
              if p.returncode != 0:
                  print("STDERR:", p.stderr[-1500:], flush=True)
              _LAST["stderr"] = (p.stderr or "")[-1500:]
              _LAST["cmd"] = cmd[:120]
              return p

          try:
              # 0) repo z wbudowanego tarballa base64 (GET z sandboxu zablokowany przez proxy)
              import base64, io
              # repo: pobierz tarball z receivera (GET /payload/), zamiast inline b64
              # (env limit 32 KiB — inline tarball ~30 KB łamie ActorTemplate)
              import urllib.request
              for _try in range(4):
                  try:
                      with open("/tmp/repo.tar.gz", "wb") as f:
                          f.write(urllib.request.urlopen(
                              "http://100.65.215.34:18080/payload/repo.tar.gz",
                              timeout=30).read())
                      break
                  except Exception as _e:
                      print("retry fetch repo.tar.gz:", _e, flush=True)
                      import time as _t; _t.sleep(5)
              REPO_B64 = None  # nie używane; tarball już na dysku
              os.makedirs("repo", exist_ok=True)
              import tarfile
              with tarfile.open("/tmp/repo.tar.gz") as tf:
                  tf.extractall("repo")
              os.makedirs("/workspace/agent-lab", exist_ok=True)
              with tarfile.open("/tmp/repo.tar.gz") as tf:
                  tf.extractall("/workspace/agent-lab", filter="data")
              repo = "/workspace/agent-lab"
              print("REPO:", repo, flush=True)
              spec_path = os.path.join(repo, "specs", "top-lines.md")
              spec = open(spec_path, encoding="utf-8").read()
              print("SPEC_LEN:", len(spec), flush=True)

              # 1) LLM single-shot: provider-agnostyczny adapter
              #    gemini       = REST v1beta generateContent (punkt odniesienia)
              #    openai-compat= /chat/completions (OpenRouter, DeepSeek,
              #                   GLM, Ollama, vLLM — jeden format)
              import time
              PROMPT = ("Zaimplementuj w Pythonie funkcje opisana specyfikacja. Zwroc DOKLADNIE jeden blok kodu "
                        "w markdown (```python ... ```), zaden tekst poza nim. "
                        "Blok = pelna zawartosc pliku src/lab/__init__.py: kompletna samodzielna implementacja "
                        "top_lines w tym jednym pliku (def top_lines(text: str, n: int = 5) -> list[str]), "
                        "definicja __all__ = [\"top_lines\"], ZERO importow z innych modulow pakietu lab. "
                        "Scoring: dlugosc linii cap 120 + 5 za kazdy znak '#'; puste linie nigdy w wyniku; "
                        "n > liczba kandydatow -> wszystkie; n <= 0 -> ValueError; wynik w kolejnosci wystepowania. "
                        "SPECYFIKACJA:\n" + spec)
              # env limit 32 KiB: existing src (17 kB) wstrzykiwany w RUNTIME
              # z rozpakowanego tarballa (token __EXISTING_SRC__ w PROMPT)
              PROMPT = PROMPT.replace("__EXISTING_SRC__", open(
                  os.path.join(repo, "src", "lab", "__init__.py"),
                  encoding="utf-8").read())
              PROVIDER = os.environ.get("MODEL_PROVIDER", "gemini").strip()
              headers = {"Content-Type": "application/json"}
              # W22: BASE URL (default oficjalny API; przez quota-proxy przy failover drillu)
              # + kolejka modeli glowny+fallbacki (puste = bez failoveru, jak dotychczas)
              BASE = (os.environ.get("GEMINI_BASE_URL") or
                      "https://generativelanguage.googleapis.com").rstrip("/")
              model_q = [os.environ.get("LLM_MODEL", "gemini-flash-lite-latest")]
              model_q += [m.strip() for m in os.environ.get("LLM_FALLBACK_MODELS", "")
                          .split(",") if m.strip()]
              model = model_q[0]
              if PROVIDER == "openai-compat":
                  url = os.environ["LLM_BASE_URL"].rstrip("/") + "/chat/completions"
                  headers["Authorization"] = "Bearer " + os.environ["LLM_KEY"]
                  body = json.dumps({"model": model,
                                     "messages":[{"role":"user","content":PROMPT}],
                                     "temperature":0.2, "max_tokens":16384,
                                     "reasoning": {"enabled": False,
                                                   "max_tokens": 4096}}).encode()
              else:  # gemini
                  url = (BASE + "/v1beta/models/" + model
                         + ":generateContent?key=" + os.environ["GEMINI_API_KEY"])
                  body = json.dumps({"contents":[{"role":"user","parts":[{"text":PROMPT}]}],
                                     "generationConfig":{"temperature":0.2,"maxOutputTokens":16384}}).encode()
              def _body_for(m):
                  if PROVIDER == "openai-compat":
                      return json.dumps({"model": m,
                                         "messages":[{"role":"user","content":PROMPT}],
                                         "temperature":0.2, "max_tokens":16384,
                                         "reasoning": {"enabled": False,
                                                       "max_tokens": 4096}}).encode()
                  return json.dumps({"contents":[{"role":"user","parts":[{"text":PROMPT}]}],
                                     "generationConfig":{"temperature":0.2,
                                                         "maxOutputTokens":16384}}).encode()
              answer = ""
              attempt = 0
              while not answer:
                  req = urllib.request.Request(url, data=body, headers=headers)
                  try:
                      r = urllib.request.urlopen(req, timeout=180)
                      d = json.loads(r.read())
                      if PROVIDER == "openai-compat":
                          answer = ((d.get("choices") or [{}])[0].get("message",{})
                                    .get("content") or "").strip()
                      else:
                          cands = d.get("candidates") or []
                          if not cands:
                              raise RuntimeError("no candidates: " + json.dumps(d)[:300])
                          answer = "".join(p.get("text","") for p in cands[0].get("content",{}).get("parts",[])).strip()
                      if answer:
                          break
                      raise RuntimeError("empty content")
                  except urllib.error.HTTPError as e:
                      msg = e.read().decode()[:300]
                      print("HTTP", e.code, msg[:200], flush=True)
                      raw_tail = (raw_tail + "\nHTTP " + str(e.code) + ": " + msg).strip()[-4000:]
                      if e.code == 429 and len(model_q) > 1:
                          # W22: quota wyczerpana na modelu glownym -> fallback
                          model_q.pop(0)
                          model = model_q[0]
                          print("FAILOVER ->", model, flush=True)
                          if PROVIDER == "gemini":
                              url = (BASE + "/v1beta/models/" + model
                                     + ":generateContent?key="
                                     + os.environ["GEMINI_API_KEY"])
                          body = _body_for(model)
                          attempt = 0
                          continue
                      if e.code in (429, 500, 503) and attempt < 5:
                          attempt += 1
                          time.sleep(25 * attempt)
                          continue
                      raise
              print("MODEL_IN_USE:", model, flush=True)
              if not answer:
                  raise RuntimeError("empty answer from LLM (" + PROVIDER + ")")
              print("ANSWER_LEN:", len(answer), flush=True)
              raw_tail = answer[-1500:]

              # 4) ekstrakcja blokow -> pliki
              # multi-file: gdy pierwszy blok ma naglowek "# FILE: <path>", kazdy blok
              # zapisujemy do wskazanego pliku (wyłącznie src/); inaczej tryb single-file
              blocks = re.findall(r"```(?:python)?\s*\n(.*?)```", answer, re.S)
              if len(blocks) < 1:
                  raise RuntimeError(f"expected 1 code block, got {len(blocks)}; head=" + answer[:400])
              if re.search(r"^#\s*FILE:\s*\S+", blocks[0], re.M):
                  writes = []
                  for b in blocks:
                      fm = re.search(r"^#\s*FILE:\s*(\S+)", b, re.M)
                      if not fm:
                          raise RuntimeError("multi-file blok bez naglowka # FILE: " + b[:120])
                      rel = fm.group(1)
                      if not rel.startswith("src/"):
                          raise RuntimeError("sciezka poza src/: " + rel)
                      code = b[fm.end():].strip() + "\n"
                      writes.append((rel, code))
                  d1 = []
                  for rel, code in writes:
                      full = os.path.join(repo, rel)
                      old_f = open(full, encoding="utf-8").read() if os.path.exists(full) else ""
                      os.makedirs(os.path.dirname(full), exist_ok=True)
                      open(full, "w", encoding="utf-8").write(code)
                      d1 += list(difflib.unified_diff(old_f.splitlines(True), code.splitlines(True),
                              "a/" + rel, "b/" + rel))
              else:
                  src_code = blocks[0].strip() + "\n"
                  src_path = os.path.join(repo, "src", "lab", "__init__.py")
                  old_src = open(src_path, encoding="utf-8").read() if os.path.exists(src_path) else ""
                  os.makedirs(os.path.dirname(src_path), exist_ok=True)
                  open(src_path, "w", encoding="utf-8").write(src_code)
                  d1 = None  # single-file: diff liczony w kroku 7

              # 5) deterministyczne testy wlasne (zgodne ze spec), pisane przez skrypt
              test_code = "\n".join([
                  "import sys",
                  "sys.path.insert(0, 'src')",
                  "from lab import top_lines",
                  "",
                  "assert top_lines('a\\nbb\\nccc', 2) == ['bb', 'ccc'], 'top-n by score, appearance order'",
                  "assert top_lines('aaa\\n# b\\ncc', 1) == ['# b'], 'heading bonus'",
                  "assert top_lines('one\\ntwo', 99) == ['one', 'two'], 'n > lines returns all'",
                  "assert top_lines('x\\n\\n   \\ny', 5) == ['x', 'y'], 'blank lines never returned'",
                  "for bad in (0, -3):",
                  "    try:",
                  "        top_lines('x', bad); raise SystemExit('no ValueError for n=%d' % bad)",
                  "    except ValueError:",
                  "        pass",
                  "assert top_lines('zz\\naa', 2) == ['zz', 'aa'], 'order of appearance preserved'",
                  "long = 'L' * 300",
                  "assert top_lines(long + '\\n' + 'm' * 100, 1) == [long], 'cap 120: 100-char beats 300-char'",
                  "assert top_lines('# a\\n## b', 2) == ['# a', '## b'], 'each # counts, appearance order'",
                  "print('ALL SPEC TESTS PASSED')",
                  ""])
              test_path = os.path.join(repo, "tests", "test_top_lines.py")
              os.makedirs(os.path.dirname(test_path), exist_ok=True)
              open(test_path, "w", encoding="utf-8").write(test_code)

              # 6) testy w sandboxie
              t = sh(f"cd {repo} && python3 tests/test_top_lines.py", timeout=120)
              tests_out = (((t.stdout or "") + "\n" + (t.stderr or ""))[-2000:]) if t else "TIMEOUT"
              print("TESTS_RC:", t.returncode if t else "timeout", flush=True)
              if not t or t.returncode != 0:
                  raise RuntimeError("tests failed in sandbox")

              # 7) unified diff (bez git w sandboxie); multi-file policzony w kroku 4
              if d1 is None:
                  d1 = list(difflib.unified_diff(old_src.splitlines(True), src_code.splitlines(True),
                        "a/src/lab/__init__.py", "b/src/lab/__init__.py"))
              d2 = list(difflib.unified_diff([], test_code.splitlines(True),
                        "a/tests/test_top_lines.py", "b/tests/test_top_lines.py"))
              patch = "--- feat/top-lines\n" + "".join(d1) + "".join(d2)
              status = "ok"
          except Exception as e:
              status = "error: " + repr(e)[:300]
              raw_tail = (raw_tail + "\n[" + _LAST["cmd"] + "]\n" + _LAST["stderr"]).strip()[-4000:]

          payload = json.dumps({
              "task": "lab-toplines1", "status": status,
              "fetched_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "answer": answer[:20000], "patch": patch[:30000],
              "tests_out": tests_out[:2000], "raw_tail": raw_tail[:3000],
          }, ensure_ascii=False).encode()
          req = urllib.request.Request(RECEIVER, data=payload, headers={"Content-Type": "application/json"})
          try:
              code = urllib.request.urlopen(req, timeout=15).status
          except Exception as e:
              code = repr(e)
          print("PHASE_POST:", code, flush=True)
          print("FINAL_STATUS:", status, flush=True)
    env:
        - name: GEMINI_API_KEY
          value: "__GEMINI_KEY__"
        - name: MODEL_PROVIDER
          value: "__MODEL_PROVIDER__"
        - name: LLM_MODEL
          value: "__LLM_MODEL__"
        - name: LLM_BASE_URL
          value: "__LLM_BASE_URL__"
        - name: LLM_KEY
          value: "__LLM_KEY__"
        - name: GEMINI_BASE_URL
          value: "__GEMINI_BASE_URL__"
        - name: LLM_FALLBACK_MODELS
          value: "__LLM_FALLBACK_MODELS__"
    debug: true
